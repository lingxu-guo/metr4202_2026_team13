aruco_detection:
  ros__parameters:
    image_topic: /camera/image_raw
    detections_topic: /aruco/detections
    debug_image_topic: /aruco/debug_image
    # Final-demo markers use OpenCV's 6x6_1000 family (IDs 0, 2, and 42).
    # Camera intrinsics/distortion come from /camera/camera_info.
    dictionary: DICT_6X6_1000
    min_marker_perimeter_px: 40.0
    max_detection_rate_hz: 0.0
    publish_debug_image: false

aruco_localization:
  ros__parameters:
    camera_info_topic: /camera/camera_info
    detections_topic: /aruco/detections
    marker_map_topic: /aruco/marker_map
    visualization_topic: /aruco/visualization
    visualization_height_m: 0.15
    visualization_scale_m: 0.18
    odom_frame: odom
    map_frame: map
    marker_length_m: 0.10
    min_depth_m: 0.15
    max_depth_m: 4.0
    max_reprojection_error_px: 3.0
    measurement_stddev_m: 0.08
    batch_outlier_sigma: 3.5
    batch_outlier_noise_floor_stddevs: 3.0
    confirmation_count: 3
    process_noise_m2_per_s: 0.0001
    innovation_gate_squared: 9.21
    min_fusion_interval_s: 0.20
    min_observer_translation_m: 0.10
    min_observer_yaw_degrees: 10.0
    tf_timeout_s: 0.10

